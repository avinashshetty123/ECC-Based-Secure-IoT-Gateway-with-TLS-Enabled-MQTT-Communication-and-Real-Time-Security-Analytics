<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <title>ECC-Based Secure IoT Gateway - architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ECC-Based Secure IoT Gateway: architecture</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#475569">Everything runs on one Windows laptop (localhost). Certificates come from a local DEMO CA, not a public CA.</text>

  <!-- trust boundary -->
  <rect x="20" y="80" width="1160" height="560" rx="16" fill="none" stroke="#94a3b8" stroke-dasharray="6 6"/>
  <text x="34" y="100" font-size="12" fill="#64748b">localhost (127.0.0.1 / ::1) only</text>

  <!-- PKI -->
  <rect x="470" y="96" width="260" height="78" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="600" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Local demo CA (ECDSA P-256)</text>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#78350f">scripts/gen_certs.ps1 (OpenSSL 3)</text>
  <text x="600" y="158" text-anchor="middle" font-size="12" fill="#78350f">signs broker + 23 client certificates</text>

  <!-- devices -->
  <rect x="40" y="220" width="220" height="200" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="150" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Device fleet (1-20)</text>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#1e3a8a">app/simulator/fleet.py</text>
  <rect x="58" y="280" width="184" height="28" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text x="150" y="299" text-anchor="middle" font-size="12" fill="#1e3a8a">dev-001 … dev-020</text>
  <text x="150" y="328" text-anchor="middle" font-size="12" fill="#334155">temp · humidity · soil (SIMULATED)</text>
  <text x="150" y="348" text-anchor="middle" font-size="12" fill="#334155">JSON + seq + timestamps</text>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#334155">own cert (mTLS) or password</text>
  <text x="150" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">publish → ingest/&lt;own id&gt;</text>

  <!-- broker -->
  <rect x="470" y="220" width="260" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Eclipse Mosquitto 2.1.2</text>
  <text x="600" y="270" text-anchor="middle" font-size="12" fill="#14532d">A plain :1884 · B TLS :8883 · C mTLS :8884</text>
  <text x="600" y="294" text-anchor="middle" font-size="12" fill="#334155">TLS 1.2+ (TLS 1.3 negotiated)</text>
  <text x="600" y="312" text-anchor="middle" font-size="12" fill="#334155">ECDSA P-256 cert · ECDHE (X25519)</text>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#334155">AES-GCM / ChaCha20 records</text>
  <text x="600" y="354" text-anchor="middle" font-size="12" fill="#334155">no anonymous · password file / cert CN</text>
  <text x="600" y="372" text-anchor="middle" font-size="12" fill="#334155">topic ACL (least privilege)</text>
  <text x="600" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">log → logs/mosquitto_*.log</text>

  <!-- gateway -->
  <rect x="900" y="220" width="260" height="200" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1030" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Secure gateway</text>
  <text x="1030" y="266" text-anchor="middle" font-size="12" fill="#4c1d95">app/gateway/gateway.py</text>
  <text x="1030" y="292" text-anchor="middle" font-size="12" fill="#334155">subscribe ingest/+</text>
  <text x="1030" y="312" text-anchor="middle" font-size="12" fill="#334155">schema + range validation</text>
  <text x="1030" y="332" text-anchor="middle" font-size="12" fill="#334155">seq check: replay / gap / restart</text>
  <text x="1030" y="352" text-anchor="middle" font-size="12" fill="#334155">auto-reconnect · redacted logs</text>
  <text x="1030" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">valid → sensors/&lt;id&gt;/telemetry</text>
  <text x="1030" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">invalid → gateway/events</text>

  <!-- collector -->
  <rect x="900" y="470" width="260" height="140" rx="12" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1030" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">Collector</text>
  <text x="1030" y="516" text-anchor="middle" font-size="12" fill="#164e63">app/analytics/collector.py</text>
  <text x="1030" y="540" text-anchor="middle" font-size="12" fill="#334155">telemetry + latency (perf_counter)</text>
  <text x="1030" y="558" text-anchor="middle" font-size="12" fill="#334155">gateway events · broker-log parser</text>
  <text x="1030" y="576" text-anchor="middle" font-size="12" fill="#334155">psutil CPU / RSS</text>

  <!-- sqlite -->
  <rect x="470" y="490" width="260" height="100" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text x="600" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SQLite (WAL)</text>
  <text x="600" y="540" text-anchor="middle" font-size="12" fill="#334155">readings · security_events · connection_events</text>
  <text x="600" y="558" text-anchor="middle" font-size="12" fill="#334155">resource_samples · benchmark_runs/results</text>
  <text x="600" y="576" text-anchor="middle" font-size="12" fill="#334155">data/iot_gateway.db</text>

  <!-- dashboard -->
  <rect x="40" y="490" width="220" height="100" rx="12" fill="#fff1f2" stroke="#e11d48"/>
  <text x="150" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#881337">Streamlit dashboard</text>
  <text x="150" y="540" text-anchor="middle" font-size="12" fill="#334155">Plotly charts · filters · CSV</text>
  <text x="150" y="558" text-anchor="middle" font-size="12" fill="#334155">127.0.0.1:8501</text>
  <text x="150" y="576" text-anchor="middle" font-size="12" fill="#334155">reads DB + benchmark CSVs only</text>

  <!-- arrows -->
  <line x1="260" y1="300" x2="466" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="363" y="292" text-anchor="middle" font-size="11" fill="#334155">① PUBLISH (TLS)</text>
  <line x1="730" y1="290" x2="896" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="813" y="282" text-anchor="middle" font-size="11" fill="#334155">② deliver ingest/+</text>
  <line x1="896" y1="340" x2="734" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="356" text-anchor="middle" font-size="11" fill="#334155">③ publish telemetry / events</text>
  <path d="M 700 420 Q 820 470 896 520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="790" y="482" font-size="11" fill="#334155">④ subscribe</text>
  <line x1="896" y1="560" x2="734" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="552" text-anchor="middle" font-size="11" fill="#334155">⑤ INSERT</text>
  <line x1="466" y1="540" x2="264" y2="540" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="365" y="532" text-anchor="middle" font-size="11" fill="#334155">⑥ SELECT (read-only)</text>
  <line x1="600" y1="174" x2="600" y2="216" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path d="M 470 140 Q 150 140 150 216" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path d="M 730 140 Q 1030 140 1030 216" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>

  <!-- attackers -->
  <rect x="40" y="660" width="560" height="84" rx="12" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="56" y="684" font-size="14" font-weight="700" fill="#7f1d1d">Blocked (tested): attacker / misconfigured clients</text>
  <text x="56" y="704" font-size="12" fill="#7f1d1d">wrong / missing password · anonymous · rogue-CA, expired, wrong-purpose or missing client cert</text>
  <text x="56" y="722" font-size="12" fill="#7f1d1d">impostor broker (hostname/CA check) · cross-device publish (ACL) · invalid data · replay (gateway)</text>
  <line x1="320" y1="660" x2="520" y2="424" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>

  <rect x="620" y="660" width="560" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="636" y="684" font-size="14" font-weight="700" fill="#0f172a">Also in the project</text>
  <text x="636" y="704" font-size="12" fill="#334155">Live crypto visualizer (127.0.0.1:8600): wire tap shows plaintext vs ciphertext</text>
  <text x="636" y="722" font-size="12" fill="#334155">Benchmark harness: Experiments A / B / C → reports/benchmarks/&lt;run&gt;/*.csv</text>
</svg>
