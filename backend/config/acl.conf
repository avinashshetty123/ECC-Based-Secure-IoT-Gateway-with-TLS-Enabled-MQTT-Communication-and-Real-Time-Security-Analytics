# Topic-level authorisation for every broker mode.
# Anything not explicitly granted here is DENIED.
#
# In plain/tls mode the username comes from the password file.
# In mtls mode the username is the client certificate's CN (use_identity_as_username).

# --- Gateway: reads raw device data, publishes validated telemetry + events
user gateway
topic read ingest/+
topic write sensors/+/telemetry
topic write gateway/events

# --- Collector (feeds SQLite/dashboard): read-only
user collector
topic read sensors/+/telemetry
topic read gateway/events

# --- Benchmark harness: same rights as the collector
user benchmark
topic read sensors/+/telemetry
topic read gateway/events

# --- Devices: each may ONLY publish to its own ingest topic (%u = its username)
pattern write ingest/%u
