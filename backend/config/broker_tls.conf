# Experiment B - MQTT over TLS with an ECC (ECDSA P-256) server certificate.
# Clients verify the broker (CA chain + hostname); the broker verifies
# clients by username/password, which now travels INSIDE the encrypted tunnel.
# Start from project root:  scripts\start_broker.ps1 -Mode tls

listener 8883 localhost
protocol mqtt

cafile   certificates/ca/ca.crt
certfile certificates/server/server.crt
keyfile  certificates/server/server.key

# Minimum protocol version. TLS 1.3 is negotiated when both sides support it.
tls_version tlsv1.2
# TLS 1.2: only ECDHE key exchange + ECDSA authentication + AEAD ciphers (forward secrecy)
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
# TLS 1.3 suites (all use ECDHE/X25519 key exchange and AEAD by design)
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

require_certificate false

allow_anonymous false
password_file config/secrets/passwd
acl_file config/acl.conf

persistence false

log_dest file logs/mosquitto_tls.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
