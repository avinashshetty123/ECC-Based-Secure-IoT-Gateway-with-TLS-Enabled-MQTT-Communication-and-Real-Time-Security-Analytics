# TEST ONLY - a broker presenting a certificate from OUR CA but issued for
# "wrong.example". Clients connecting to "localhost" must refuse it
# (hostname verification). Used by tests/test_tls_security.py.

listener 8885 localhost
protocol mqtt

cafile   certificates/ca/ca.crt
certfile certificates/negative/wronghost_server.crt
keyfile  certificates/negative/wronghost_server.key
tls_version tlsv1.2

allow_anonymous false
password_file config/secrets/passwd
acl_file config/acl.conf
persistence false
log_dest file logs/mosquitto_wronghost_test.log
connection_messages true
