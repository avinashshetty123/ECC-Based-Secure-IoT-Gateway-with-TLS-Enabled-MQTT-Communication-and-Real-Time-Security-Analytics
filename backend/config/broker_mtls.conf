# Experiment C + live demo - MUTUAL TLS.
# Both sides present ECDSA P-256 certificates issued by our local demo CA.
# The client certificate's CN becomes the MQTT username used by the ACL,
# so a device cannot claim another device's identity without its private key.
# Start from project root:  scripts\start_broker.ps1 -Mode mtls

listener 8884 localhost
protocol mqtt

cafile   certificates/ca/ca.crt
certfile certificates/server/server.crt
keyfile  certificates/server/server.key

tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Reject any client without a valid certificate from our CA
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file config/acl.conf

persistence false

log_dest file logs/mosquitto_mtls.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
