# Experiment A - baseline: MQTT over plain TCP (NO encryption).
# Localhost only. Authentication + ACL are still enforced so that the
# ONLY difference from Experiment B is TLS.
# Start from project root:  scripts\start_broker.ps1 -Mode plain

# "localhost" binds BOTH loopback addresses (127.0.0.1 and ::1). Binding only
# 127.0.0.1 made clients that resolve localhost -> ::1 first wait ~2 s to connect.
listener 1884 localhost
protocol mqtt

allow_anonymous false
password_file config/secrets/passwd
acl_file config/acl.conf

persistence false

log_dest file logs/mosquitto_plain.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
